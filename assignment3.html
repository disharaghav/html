<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Booking</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: #ffffff;
            padding: 40px;
        }

        .movie-container {
            max-width: 1300px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
        }

        .movie-card {
            text-align: center;
            background: #fff;
            padding-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0px 6px 20px rgba(0,0,0,0.1);
            transition: 0.3s ease;
        }

        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0px 12px 30px rgba(0,0,0,0.15);
        }

        .movie-card img {
            width: 100%;
            height: 450px;
            object-fit: cover;
            border-radius: 12px 12px 0 0;
        }

        .movie-title {
            font-size: 22px;
            font-weight: 600;
            margin: 18px 0 8px;
        }

        .rating {
            font-size: 16px;
            margin-bottom: 15px;
            color: #555;
        }

        .btn {
            display: inline-block;
            padding: 10px 22px;
            background: #0d6efd;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s ease;
        }

        .btn:hover {
            background: #004bce;
        }
    </style>
</head>

<body>

<div class="movie-container">

    
    <div class="movie-card">
        <img src="doctor.webp" alt="Doctor Strange 2">
        <div class="movie-title">Doctor Strange 2</div>
        <div class="rating">Rating:- 4.5</div>
        <a href="#" class="btn">Book now</a>
    </div>

    
    <div class="movie-card">
        <img src="bhool-bhulaiya-2.webp" alt="Bhool Bhulaiyaa 2">
        <div class="movie-title">Bhool Bhulaiyaa 2</div>
        <div class="rating">Rating:- 4.5</div>
        <a href="#" class="btn">Book now</a>
    </div>

    
    <div class="movie-card">
        <img src="jay.jpeg" alt="Jayeshbhai Jordaar">
        <div class="movie-title">Jayeshbhai Jordaar</div>
        <div class="rating">Rating:- 4.5</div>
        <a href="#" class="btn">Book now</a>
    </div>

    
    <div class="movie-card">
        <img src="jurassic.jpg" alt="Jurassic World">
        <div class="movie-title">Jurassic World</div>
        <div class="rating">Rating:- 4.5</div>
        <a href="#" class="btn">Book now</a>
    </div>

    
    <div class="movie-card">
        <img src="kgf 2.jpg" alt="KGF2">
        <div class="movie-title">KGF2</div>
        <div class="rating">Rating:- 4.5</div>
        <a href="#" class="btn">Book now</a>
    </div>

    
    <div class="movie-card">
        <img src="RRR_Poster.jpg" alt="RRR">
        <div class="movie-title">RRR</div>
        <div class="rating">Rating:- 4.5</div>
        <a href="#" class="btn">Book now</a>
    </div>

</div>

</body>
</html>
